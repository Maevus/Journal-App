# Local Postgres for development (ADR 0003 — the SQLite→Postgres move).
# Not the production host: prod uses a managed Postgres chosen at deploy (todo #10).
# The DATABASE_URL matching these creds is documented in .env.example.
#
#   docker compose up -d db      # start (pulls postgres:18 the first time)
#   docker compose down          # stop, keep the data volume
#   docker compose down -v       # stop and wipe the data volume
services:
  db:
    # Postgres 18 + pgvector (bundles pgvector 0.8.5). Pin the -trixie variant to
    # match the base OS (glibc) the data volume was initialised on — the plain
    # tag is bookworm, and mixing glibc collation versions on one volume warns and
    # risks collation-sensitive index corruption.
    image: pgvector/pgvector:pg18-trixie
    container_name: journal-postgres
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: journal
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18 moved the container VOLUME to /var/lib/postgresql (PGDATA now
      # lives in a version subdir, /var/lib/postgresql/18/docker). Mounting the
      # old /var/lib/postgresql/data would silently not persist. (docker-library docs)
      - journal_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  journal_pgdata:
