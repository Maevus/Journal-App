# Local Postgres for development. Not the production host — that's a managed
# Postgres chosen at deploy. Matching DATABASE_URL is in .env.example.
#
#   docker compose up -d db      # start (pulls postgres:18 the first time)
#   docker compose down          # stop, keep the data volume
#   docker compose down -v       # stop and wipe the data volume
services:
  db:
    # Postgres 18 + pgvector. Pin -trixie (glibc) to match the volume's
    # base OS — mixing glibc collation versions on one volume risks
    # collation-sensitive index corruption.
    image: pgvector/pgvector:pg18-trixie
    container_name: journal-postgres
    environment:
      POSTGRES_USER: journal
      POSTGRES_PASSWORD: journal
      POSTGRES_DB: journal
    ports:
      # Loopback only, deliberately: "5432:5432" would publish on 0.0.0.0 and
      # expose the journal + BYO-key ciphertext to the LAN behind default creds.
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18 moved the VOLUME to /var/lib/postgresql; mounting the old
      # /var/lib/postgresql/data silently does not persist.
      - journal_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U journal -d journal"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  journal_pgdata:
