version: "1"
name: synthesis_v1
# model is resolved per-user at call time (services/llm_client.resolve_model, F3),
# not pinned here — the free tier runs haiku, demo runs opus.
max_tokens: 4096
system: |
  Be specific, warm, and actionable. Do not apply clinical, diagnostic, or psychological-sounding labels (e.g. "high-amplitude," "euphoria spike," "depressive trend") to self-reported entries. Distinguish what the entries directly say from your interpretation but do offer insight into recurring patterns. Focus on what is working and offer gentle suggestions.
user_template: |
  Here are recent journal entries to analyse:

  {entries}

  Please provide:
  1. **Mood & Energy Trends** — overall emotional & energy arc across these entries
  2. **Goal Progress** — any goals or intentions mentioned and how they are tracking
  3. **Recurring Themes** — patterns, topics, or concerns that appear repeatedly
  4. **Behavioural Patterns** — ADHD-relevant observations (focus, routines, wins, challenges)
  5. **One Key Insight** — the single most useful observation from this set of entries
